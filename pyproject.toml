[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "napolnenie"
version = "0.1.0"
description = "Поиск картинок для товаров из выгрузки 1С"
requires-python = ">=3.10"
dependencies = [
  "openpyxl>=3.1.0",
  "pyyaml>=6.0",
  "ddgs>=9.0.0",
  "requests>=2.31",
  "beautifulsoup4>=4.12",
]

[project.scripts]
napolnenie = "napolnenie.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
